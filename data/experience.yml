# yaml-language-server: $schema=../.astro/collections/experience.schema.json
#
# One role per entry, newest first. Required: title, org, start, end, summary,
# and at least one highlight. `end: null` marks the current role.
# `highlights` are always shown; `details` collapse behind a "N more" toggle.
# Both render inline HTML, so a bullet may contain an <a href="...">link</a>.
# Inside a folded `>` block keep the opening <a ...> tag and its URL on one line
# (folding turns newlines into spaces), and write &amp; for a literal ampersand.
#
# Template:
#
# - title: Postdoctoral Researcher        # required
#   org: Forschungszentrum Jülich GmbH     # required
#   org_url: https://www.fz-juelich.de     # optional, links the org name
#   location: Jülich, Germany              # optional
#   start: 2025-09                         # required, YYYY-MM
#   end: null                              # required, YYYY-MM or null if current
#   track_colour: '#7C3AED'                # optional, timeline colour as #RRGGBB
#   summary: One line describing the role. # required
#   highlights:                            # required, at least one; always shown
#     - A short achievement.               #   may contain an <a> link
#   details:                               # optional, collapsed behind a toggle
#     - A supporting responsibility.
#   affiliations: [de.NBI, ELIXIR Germany] # optional, shown as tags
#   tags: [Python, containers]             # optional
#   featured: true                         # optional
#   visible: false                         # optional, hide without deleting
- title: Postdoctoral Researcher
  org: Forschungszentrum Jülich GmbH
  org_url: https://www.fz-juelich.de
  location: Jülich, Germany
  start: 2025-09
  end: null
  track_colour: '#7C3AED'
  summary: Data science and bioinformatics for mass spectrometry.
  highlights:
    - >
      AI and agentic frameworks for biocuration of metabolomics and lipidomics literature:
      named entity recognition, ontologies, controlled vocabularies, and knowledge graphs.
    - >
      SeqSidecar, a columnar query engine for nucleotide and protein sequencing reads,
      supporting filtering, search, deduplication, and remote index-based querying of
      FASTA and FASTQ at scale.
    - >
      An <a href="https://oci.bi.denbi.de/" target="_blank" rel="noopener noreferrer">OCI container
      registry</a> that mirrors the full
      <a href="https://biocontainers.pro" target="_blank" rel="noopener noreferrer">BioContainers</a>
      catalogue of over 100,000 images, with CVE scanning, SBOM generation, and image signing, run as
      a European service through de.NBI and ELIXIR.
    - >
      The <a href="https://service-registry.bi.denbi.de/" target="_blank" rel="noopener noreferrer">de.NBI
      service registration platform</a>, where de.NBI and ELIXIR Germany services are registered
      through a structured form with a REST API, EDAM ontology annotations, bio.tools integration, and
      an admin review portal.
    - >
      A <a href="https://koina.wilhelmlab.org" target="_blank" rel="noopener noreferrer">Koina</a>
      inference service operated and supported on the de.NBI Cloud as part of the federated Koina
      network for machine learning models in proteomics, reachable independently over HTTP, for
      example from Python or curl.
  details:
    - Novel algorithms and data structures for indexing and querying petabyte-scale sequencing datasets.
    - >
      Administration, strategic planning, and implementation of de.NBI infrastructure and
      services, focused on cloud infrastructure, AI, and agentic frameworks.
    - Administration and strategic expansion of de.NBI and ELIXIR Germany infrastructure and services.
    - Demonstrated EOSC EU Node use cases through the EOSC United project.
    - Part of the EOSC Entrust project, establishing blueprints for secure data processing environments.
    - Talks, posters, and workshops at national and international conferences.
    - >
      Represented de.NBI and ELIXIR Germany in national initiatives (NFDI) and European
      Commission projects.
  affiliations: [de.NBI, ELIXIR Germany, EOSC United, EOSC Entrust, NFDI]
  tags: [Python, AI, agentic systems, containers, mass spectrometry]

- title: Scientific Researcher (Postdoc)
  org: University of Freiburg
  org_url: https://www.uni-freiburg.de
  location: Freiburg, Germany
  start: 2022-08
  end: 2025-08
  track_colour: '#DC2626'
  summary: Application development, feature work, and research on Galaxy Europe.
  highlights:
    - >
      Administration and management of
      <a href="https://usegalaxy.eu" target="_blank" rel="noopener noreferrer">Galaxy Europe</a>,
      supporting over
      <a href="https://stats.galaxyproject.eu/d/000000012/galaxy-user-statistics?orgId=1&amp;from=now-7y&amp;to=now&amp;timezone=browser&amp;var-time_interval=365d&amp;refresh=15m" target="_blank" rel="noopener noreferrer">170,000 users</a>.
    - >
      Algorithms and optimisations for
      <a href="https://github.com/usegalaxy-eu/tpv-broker" target="_blank" rel="noopener noreferrer">meta-scheduling</a>,
      including reducing carbon footprint through efficient scheduling and distributed remote
      computing.
    - >
      Configuration, deployment, administration, and maintenance of the Galaxy HPC OpenStack
      cloud using Terraform, Ansible, Jenkins, Rsyslog, and the TIG stack.
  details:
    - Application development, feature innovation, and research.
    - Deliverables and reports for national and EU-funded initiatives.
    - Research data management through Galaxy.
    - Development and deployment of configurations through GitOps and Jenkins CI/CD.
    - Scripting and automation.
    - Infrastructure monitoring and performance analysis.
    - Troubleshooting, logging, and log analysis.
    - Support and documentation.
    - Partnering with collaborators on national and international projects.
    - >
      Represented the organisation at conferences through exhibition booths, presentations,
      and scientific and industry discussions.
  tags: [Galaxy, Terraform, Ansible, OpenStack, HTCondor]

