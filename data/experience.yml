- title: System Administrator and DevOps, Bioinformatics IT Core Facility
  org: Helmholtz Institute for Pharmaceutical Research Saarland
  org_url: https://www.helmholtz-hips.de
  location: Saarbrücken, Germany
  start: 2018-10
  end: 2023-03
  track_colour: '#0D9488'
  summary: Set up and ran the Drug Bioinformatics IT core facility.
  highlights:
    - Setup, design, and establishment of the Bioinformatics IT core facility.
    - >
      Installation, configuration, and maintenance of CentOS and Red Hat Linux HPC clusters,
      servers, desktops, and workstations.
    - >
      Containerised web services (Gitea, MediaWiki, WordPress, Docker registry) and
      infrastructure monitoring through Icinga.
  details:
    - Site reliability engineering processes.
    - Budgeting, purchasing, and inventory.
    - Bioinformatics application installation, configuration, deployment, and maintenance.
    - Support and documentation for all researchers.
    - >
      On-demand compute provisioning, physical and virtual, with network and storage
      allocation.
    - Storage provisioning and administration.
    - MariaDB database server administration.
    - Ansible and custom RPM packages for configuration, monitoring, and maintenance.
    - >
      Configuration of iDRAC/IPMI, DNS, TCP/IP, TLS/SSL, LDAP, Active Directory, SSH,
      Fail2ban, firewall, AutoFS, and printers.
    - Troubleshooting and resolution of hardware and software issues.
  tags: [Linux, HPC, Ansible, Docker, Icinga]

