# yaml-language-server: $schema=../.astro/collections/projects.schema.json
#
# One entry per project. Required: name, summary. Adding `repo` (owner/name, not
# a URL) pulls live stars/forks into data/.cache/github.json and makes the card
# link to the repository, so run `npm run fetch` after adding or changing a repo.
# `featured: true` promotes a project into the Selected projects grid; every
# project that has a `repo` also appears in the open-source carousel below it.
#
# Template:
#
# - name: MetaProFi                       # required
#   repo: kalininalab/metaprofi           # optional, owner/name (not a full URL)
#   summary: >                            # required, a plain sentence or two
#     What it is and why it exists.
#   tags: [Python, sequence search]       # optional
#   paper: 10.1093/bioinformatics/btad101 # optional, DOI; shows a citation count
#   url: https://example.org              # optional, project homepage
#   featured: true                        # optional, Selected projects grid
#   order: 1                              # optional, sort order among featured
- name: AlphaFold2 non-Docker
  repo: kalininalab/alphafold_non_docker
  summary: >
    AlphaFold2 ships as a Docker image, which requires root and is therefore unavailable
    on most shared HPC clusters. This is a setup that removes the Docker dependency.
  tags: [Python, Shell, HPC, structure prediction]
  featured: true
  order: 1

- name: MetaProFi
  repo: kalininalab/metaprofi
  summary: >
    A chunked Bloom filter for protein and nucleotide sequence search. It accepts a bounded
    false-positive rate in exchange for an index small enough to hold in memory at petabyte scale.
  tags: [Python, Bloom filters, sequence search]
  paper: 10.1093/bioinformatics/btad101
  featured: true
  order: 2

- name: Galaxy Europe
  repo: usegalaxy-eu/infrastructure-playbook
  summary: >
    Meta-scheduling, cloud infrastructure, deployment, and operations for the European Galaxy
    instance, which serves over 170,000 registered users.
  tags: [Terraform, Ansible, OpenStack, HTCondor]
  featured: true
  order: 3

- name: de.NBI Service Registry
  repo: deNBI/service-registry
  summary: >
    Registration platform for de.NBI and ELIXIR Germany services: a structured submission form
    with a REST API, EDAM ontology annotations, bio.tools integration, and an admin review portal.
  tags: [Python, Django, web, de.NBI]
  featured: true
  order: 4

- name: TPV Broker
  repo: usegalaxy-eu/tpv-broker
  summary: Meta-scheduler for Total Perspective Vortex, run as a service.
  tags: [Python, scheduling]

- name: d-StructMAn
  repo: kalininalab/d-StructMAn
  summary: Containerised structural annotation, from genetic variants to whole proteomes.
  tags: [Python, structural annotation]
  paper: 10.1093/gigascience/giac086

- name: Terraform training material
  repo: sanjaysrikakulam/terraform_clum2025
  summary: Terraform training material for the joint de.KCD and de.NBI Cloud User Meeting.
  tags: [Terraform, teaching]

- name: GROMACS utility scripts
  repo: sanjaysrikakulam/gromacs_utility_scripts
  summary: Utility scripts for setting up and analysing GROMACS molecular dynamics simulations.
  tags: [Python, molecular dynamics, GROMACS]
