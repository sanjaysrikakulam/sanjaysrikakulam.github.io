# yaml-language-server: $schema=../.astro/collections/projects.schema.json
- name: AlphaFold2 non-Docker
  repo: kalininalab/alphafold_non_docker
  role: Author and maintainer
  summary: >
    AlphaFold2 ships as a Docker image, which requires root and is therefore unavailable
    on most shared HPC clusters. This is a setup that removes the Docker dependency.
  tags: [Python, Shell, HPC, structure prediction]
  featured: true
  order: 1

- name: MetaProFi
  repo: kalininalab/metaprofi
  role: First author
  summary: >
    A chunked Bloom filter for protein and nucleotide sequence search. It accepts a bounded
    false-positive rate in exchange for an index small enough to hold in memory at petabyte scale.
  tags: [Python, Bloom filters, sequence search]
  paper: 10.1093/bioinformatics/btad101
  featured: true
  order: 2

- name: Galaxy Europe
  repo: usegalaxy-eu/infrastructure-playbook
  role: Maintainer
  summary: >
    Meta-scheduling, cloud infrastructure, deployment, and operations for the European Galaxy
    instance, which serves over 170,000 registered users.
  tags: [Terraform, Ansible, OpenStack, HTCondor]
  featured: true
  order: 3

- name: SeqSidecar
  repo: null
  role: Designer and developer
