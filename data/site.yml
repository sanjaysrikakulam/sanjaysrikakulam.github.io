profile:
  name: Sanjay Kumar Srikakulam
  headline: Computational methods for biology, and the infrastructure that runs them.
  headline_accent: infrastructure
  location: Germany
  avatar: /avatar.jpg
  available: true
  available_text: Open to collaboration and opportunities
  bio: >
    Postdoctoral researcher at Forschungszentrum Jülich, building small language models
    and agentic systems for mass spectrometry, including spectral annotation for
    lipidomics. Earlier work spans molecular dynamics and structure-based drug discovery,
    sequence indexing at petabyte scale, and three years running Galaxy Europe for over
    170,000 researchers.

