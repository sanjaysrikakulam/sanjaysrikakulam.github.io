# Site configuration: one file, edited in place (not a list of entries). Keys:
#
#   profile   name, headline (headline_accent must be a substring of it),
#             location, optional email, avatar path, and bio (hero and CV summary).
#   links     label: url pairs, rendered as the contact and profile icons.
#   sections  ordered page sections (id, optional title/description); set a
#             section's `visible: false` to hide it. Some ids carry subsections.
#   display   photo, proof_strip, theme_toggle, grid_includes_featured, and the
#             open_source carousel settings.
#   proof     the stat strip; each item has a label and either a live `metric`
#             (resolved in src/lib/proof.ts) or a literal `value`.
#   pdf       page_size (A4 | Letter), the ordered `sections` in the CV, and
#             optional per-type `max_items` caps.
#   analytics optional. Set `umami.script_url` and `umami.website_id` from your
#             self-hosted Umami instance to enable privacy-friendly analytics.
#             Omit the block and no tracker, click attribute, or footer note is
#             rendered. Umami sets no cookies and stores no personal data, so no
#             consent banner is needed. `domains` lists the hostnames the tracker
#             may run on; it is an exact hostname match with no wildcards, so
#             adding a CNAME custom domain without adding it here stops all
#             tracking silently. Leave it empty to track on every host.
#
profile:
  name: Sanjay Kumar Srikakulam
  headline: Computational methods for biology, and the infrastructure that runs them.
  headline_accent: infrastructure
  location: Germany
  avatar: /avatar.jpg
  available: true
  available_text: Open to collaboration and opportunities
  bio: >
    From the atoms of a single protein to petabytes of sequencing data, Sanjay works
    across both the research and the infrastructure of computational biology. A
    postdoctoral researcher at Forschungszentrum Jülich, he applies AI and agentic
    frameworks to the biocuration of mass spectrometry literature, explores small language
    models (SLMs) for annotating mass spectra, and builds algorithms for large-scale
    sequence indexing. His earlier work spanned structural
    bioinformatics and molecular dynamics, and he has run the Galaxy Europe platform. He
    also works with de.NBI and ELIXIR Germany on research cloud infrastructure.

links:
  github: https://github.com/sanjaysrikakulam
  scholar: https://scholar.google.com/citations?user=YF_dAHMAAAAJ&hl=en
  orcid: https://orcid.org/0000-0002-1752-5060
  researchgate: https://www.researchgate.net/profile/Sanjay-Kumar-Srikakulam
  linkedin: https://www.linkedin.com/in/sanjay-kumar-srikakulam
  zenodo: https://zenodo.org/search?q=metadata.creators.person_or_org.name%3A%22Srikakulam%2C%20Sanjay%20Kumar%22

sections:
  - id: work
    title: Selected projects
    description: >
      Software and infrastructure I have built or contributed to.
  - id: experience
    title: Education and roles
  - id: research
    title: Publications and outputs
    description: >
      Journal articles, conference papers, preprints, and project deliverables.
    subsections:
      - id: publications
      - id: conferences
        title: Conferences and talks
        description: >
          Talks, posters, and workshops, plus meetings attended without presenting.
  - id: community
    title: Hackathons
    description: Events attended, and those I helped organise or lead.
  - id: contact
    title: Get in touch
    description: Open to conversations, and collaborations.

display:
  photo: true
  proof_strip: true
  theme_toggle: true
  grid_includes_featured: true
  open_source:
    carousel: true
    per_view: 3
    autoplay: true
    autoplay_interval: 5000

proof:
  - metric: publications.count
    label: Publications, deliverables and reports
  - metric: zenodo.downloads
    label: Zenodo downloads
  - value: 11 yrs
    label: Research and infrastructure

pdf:
  page_size: A4
  sections: [profile, education, experience, publications, skills]

analytics:
  umami:
    script_url: https://umami.srikakulam.xyz/hedgehog.js
    website_id: 4f94f13d-eac8-4e45-9ec0-af31e280b0de
    domains:
      - sanjaysrikakulam.github.io
