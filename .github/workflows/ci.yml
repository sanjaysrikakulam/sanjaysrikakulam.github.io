name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit dependencies
        continue-on-error: true
        run: npm audit --audit-level=moderate
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Guard against attribution and process markers
        run: |
          # git grep only walks the tracked tree, so it already skips node_modules,
          # dist, and anything else ignored, without a directory allowlist to maintain.
          # Every phrase below is either split with a single-character bracket class,
          # or (for the dash characters, which must not sit literally in this file
          # either) built at runtime from an escape sequence, so this step cannot
          # match its own definition and fail the job on itself.
          EM_DASH=$'\u2014'
          EN_DASH=$'\u2013'
          PATTERN="co-authored-b[y]|generated wit[h]|per the pla[n]|per the spe[c]|\bADR\b"
          PATTERN="$PATTERN|[Pp]has[e] ?[0-9]|[Tt]as[k] ?[0-9]|[Ss]te[p] ?[0-9]|${EM_DASH}|${EN_DASH}"

          if git grep -Eni "$PATTERN" -- .; then
            echo "Forbidden marker found in a tracked file."
            exit 1
          fi
          echo "No forbidden markers in tracked files."

          if git log --all --format=%B | grep -Ei "$PATTERN"; then
            echo "Forbidden marker found in a commit message."
            exit 1
          fi
          echo "No forbidden markers in commit history."

  build:
    needs: verify
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Refresh metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run fetch

      - name: Commit refreshed metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/.cache)" ]; then
            git add data/.cache
            git commit -m "Update cached repository, citation, and download figures"
            git push
          else
            echo "Figures unchanged."
          fi

      - run: npm run build

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

      - name: Generate CV
        run: npm run pdf

      - name: Copy the generated CV into the build output
        run: cp public/Sanjay_Srikakulam_CV.pdf dist/

      - uses: actions/configure-pages@v6
        with:
          # The first run on a fresh repository fails here otherwise: Pages has
          # to be switched to the "GitHub Actions" source before this action
          # can read its settings, and nothing prompts for that automatically.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
